<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Motion — Sign In</title>
  <meta name="description" content="Sign in to your Motion workspace. Designed for clarity." />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="../css/styles.css" rel="stylesheet" />

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-primary-fixed": "#403f3f",
            "on-tertiary": "#f4faff",
            "on-primary-fixed-variant": "#5c5b5b",
            "on-error": "#fff7f6",
            "surface": "#f9f9f8",
            "surface-variant": "#dde4e3",
            "surface-container-high": "#e4e9e8",
            "on-primary-container": "#525151",
            "error-dim": "#4e0309",
            "on-secondary-fixed": "#3f3f3f",
            "tertiary-container": "#d0ecff",
            "tertiary-fixed": "#d0ecff",
            "background": "#f9f9f8",
            "on-error-container": "#752121",
            "secondary": "#5f5f5f",
            "error-container": "#fe8983",
            "surface-container-lowest": "#ffffff",
            "on-secondary-container": "#515252",
            "on-surface": "#2d3433",
            "on-tertiary-fixed-variant": "#486272",
            "on-secondary-fixed-variant": "#5b5b5b",
            "primary-dim": "#535252",
            "primary": "#5f5e5e",
            "surface-tint": "#5f5e5e",
            "surface-container-low": "#f2f4f3",
            "on-secondary": "#faf8f8",
            "on-primary": "#faf7f6",
            "inverse-surface": "#0c0f0e",
            "surface-bright": "#f9f9f8",
            "secondary-fixed": "#e3e2e2",
            "outline": "#757c7b",
            "tertiary-fixed-dim": "#c2def0",
            "on-surface-variant": "#5a6060",
            "secondary-fixed-dim": "#d5d4d4",
            "secondary-dim": "#535353",
            "inverse-on-surface": "#9c9d9c",
            "outline-variant": "#adb3b2",
            "tertiary-dim": "#3c5666",
            "surface-dim": "#d4dcda",
            "tertiary": "#486272",
            "surface-container-highest": "#dde4e3",
            "primary-container": "#e5e2e1",
            "primary-fixed": "#e5e2e1",
            "error": "#9f403d",
            "on-tertiary-fixed": "#2c4655",
            "secondary-container": "#e3e2e2",
            "primary-fixed-dim": "#d6d4d3",
            "inverse-primary": "#ffffff",
            "on-tertiary-container": "#3e5868",
            "surface-container": "#ebeeed",
            "on-background": "#2d3433"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            lg: "0.5rem",
            xl: "0.75rem",
            full: "9999px"
          },
          fontFamily: {
            headline: ["Inter"],
            body: ["Inter"],
            label: ["Inter"]
          }
        },
      },
    }
  </script>
  <style>
    .tonal-stack-card { background-color: #ffffff; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6">

  <main class="w-full max-w-[420px] space-y-10">
    <!-- Branding -->
    <header class="text-center space-y-2">
      <div class="flex justify-center mb-6">
        <div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center shadow-sm">
          <span class="material-symbols-outlined text-on-primary text-2xl">motion_photos_on</span>
        </div>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tighter text-on-surface">Motion</h1>
      <p class="text-on-surface-variant font-label tracking-wide text-sm">DESIGNED FOR CLARITY</p>
    </header>

    <!-- Login Card -->
    <div class="tonal-stack-card rounded-xl p-8 shadow-[0_40px_40px_-15px_rgba(45,52,51,0.04)] border border-outline-variant/10">
      <!-- Tab Switcher -->
      <div class="flex mb-6 bg-surface-container rounded-lg p-1">
        <button id="tab-signin" class="flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-on-surface transition-all">Sign In</button>
        <button id="tab-signup" class="flex-1 py-2 text-sm font-medium rounded-md text-on-surface-variant transition-all">Sign Up</button>
      </div>

      <!-- Error Display -->
      <div id="auth-error" class="hidden mb-4 p-3 rounded-lg bg-error-container/20 text-on-error-container text-sm font-medium"></div>

      <!-- Sign In Form -->
      <form id="form-signin" class="space-y-6">
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold tracking-wider text-on-surface-variant uppercase pl-1" for="signin-email">Email</label>
            <input class="w-full px-4 py-3 bg-surface-container rounded-lg border-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-on-surface placeholder:text-outline text-sm" id="signin-email" name="email" placeholder="name@workspace.com" required type="email" />
          </div>
          <div class="space-y-1.5">
            <div class="flex justify-between items-center px-1">
              <label class="block text-xs font-semibold tracking-wider text-on-surface-variant uppercase" for="signin-password">Password</label>
              <a class="text-[11px] font-medium text-tertiary hover:text-on-tertiary-container transition-colors" href="#">Forgot password?</a>
            </div>
            <input class="w-full px-4 py-3 bg-surface-container rounded-lg border-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-on-surface placeholder:text-outline text-sm" id="signin-password" name="password" placeholder="••••••••" required type="password" />
          </div>
        </div>
        <button id="btn-signin" class="w-full py-3.5 bg-gradient-to-r from-primary to-primary-dim text-on-primary rounded-full font-semibold text-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-sm" type="submit">
          Continue to Workspace
        </button>
        <div class="relative py-2">
          <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant/20"></div></div>
          <div class="relative flex justify-center text-xs"><span class="px-3 bg-white text-outline font-medium">OR</span></div>
        </div>
        <button id="btn-google" class="w-full flex items-center justify-center gap-3 py-3 px-4 rounded-full border border-outline-variant/30 bg-surface-container-lowest text-on-surface text-sm font-medium hover:bg-surface-container-low transition-colors duration-200" type="button">
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
          </svg>
          Continue with Google
        </button>
      </form>

      <!-- Sign Up Form (hidden by default) -->
      <form id="form-signup" class="space-y-6 hidden">
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold tracking-wider text-on-surface-variant uppercase pl-1" for="signup-name">Full Name</label>
            <input class="w-full px-4 py-3 bg-surface-container rounded-lg border-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-on-surface placeholder:text-outline text-sm" id="signup-name" name="name" placeholder="Your full name" required type="text" />
          </div>
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold tracking-wider text-on-surface-variant uppercase pl-1" for="signup-email">Email</label>
            <input class="w-full px-4 py-3 bg-surface-container rounded-lg border-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-on-surface placeholder:text-outline text-sm" id="signup-email" name="email" placeholder="name@workspace.com" required type="email" />
          </div>
          <div class="space-y-1.5">
            <label class="block text-xs font-semibold tracking-wider text-on-surface-variant uppercase pl-1" for="signup-password">Password</label>
            <input class="w-full px-4 py-3 bg-surface-container rounded-lg border-none focus:ring-1 focus:ring-primary focus:bg-surface-container-lowest transition-all duration-200 text-on-surface placeholder:text-outline text-sm" id="signup-password" name="password" placeholder="Min. 6 characters" required type="password" minlength="6" />
          </div>
        </div>
        <button id="btn-signup" class="w-full py-3.5 bg-gradient-to-r from-primary to-primary-dim text-on-primary rounded-full font-semibold text-sm hover:opacity-90 active:scale-[0.98] transition-all shadow-sm" type="submit">
          Create Account
        </button>
      </form>
    </div>

    <!-- Footer -->
    <footer class="text-center space-y-4">
      <p id="footer-text" class="text-sm text-on-surface-variant">
        Don't have an account?
        <a id="footer-link" class="font-bold text-on-surface hover:underline decoration-outline-variant underline-offset-4 cursor-pointer">Join Motion</a>
      </p>
      <div class="flex justify-center gap-6 text-[11px] font-medium text-outline tracking-wider uppercase">
        <a class="hover:text-on-surface transition-colors" href="#">Privacy</a>
        <a class="hover:text-on-surface transition-colors" href="#">Terms</a>
        <a class="hover:text-on-surface transition-colors" href="#">Help</a>
      </div>
    </footer>
  </main>

  <!-- Decorative Background -->
  <div class="fixed bottom-0 left-0 w-full h-1/2 -z-10 pointer-events-none overflow-hidden">
    <div class="absolute -bottom-24 -left-24 w-96 h-96 bg-tertiary-container/10 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-12 -right-12 w-64 h-64 bg-primary-container/15 rounded-full blur-3xl"></div>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="hidden fixed inset-0 bg-surface/80 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="text-center">
      <div class="loading-spinner mx-auto mb-3"></div>
      <p class="text-sm text-on-surface-variant">Signing in...</p>
    </div>
  </div>

  <!-- Auth Script -->
  <script type="module">
    import { signIn, signUp, signInWithGoogle, getSession } from '../js/supabase.js';

    // Check if already logged in
    const session = await getSession();
    if (session) {
      window.location.href = '../index.html';
    }

    // DOM elements
    const formSignIn = document.getElementById('form-signin');
    const formSignUp = document.getElementById('form-signup');
    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const errorEl = document.getElementById('auth-error');
    const loading = document.getElementById('loading-overlay');
    const footerText = document.getElementById('footer-text');
    const footerLink = document.getElementById('footer-link');

    let isSignUp = false;

    function showError(msg, isSuccess = false) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
      if (isSuccess) {
        errorEl.classList.replace('bg-error-container/20', 'bg-tertiary-container/20');
        errorEl.classList.replace('text-on-error-container', 'text-on-tertiary-container');
      } else {
        errorEl.classList.replace('bg-tertiary-container/20', 'bg-error-container/20');
        errorEl.classList.replace('text-on-tertiary-container', 'text-on-error-container');
      }
      setTimeout(() => errorEl.classList.add('hidden'), 5000);
    }

    function setLoading(show, text = 'Signing in...') {
      loading.querySelector('p').textContent = text;
      loading.classList.toggle('hidden', !show);
    }

    function switchTab(toSignUp) {
      isSignUp = toSignUp;
      formSignIn.classList.toggle('hidden', toSignUp);
      formSignUp.classList.toggle('hidden', !toSignUp);
      tabSignIn.className = toSignUp
        ? 'flex-1 py-2 text-sm font-medium rounded-md text-on-surface-variant transition-all'
        : 'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-on-surface transition-all';
      tabSignUp.className = toSignUp
        ? 'flex-1 py-2 text-sm font-semibold rounded-md bg-white shadow-sm text-on-surface transition-all'
        : 'flex-1 py-2 text-sm font-medium rounded-md text-on-surface-variant transition-all';
      footerText.innerHTML = toSignUp
        ? `Already have an account? <a id="footer-link" class="font-bold text-on-surface hover:underline decoration-outline-variant underline-offset-4 cursor-pointer">Sign In</a>`
        : `Don't have an account? <a id="footer-link" class="font-bold text-on-surface hover:underline decoration-outline-variant underline-offset-4 cursor-pointer">Join Motion</a>`;
      document.getElementById('footer-link').addEventListener('click', () => switchTab(!isSignUp));
      errorEl.classList.add('hidden');
    }

    tabSignIn.addEventListener('click', () => switchTab(false));
    tabSignUp.addEventListener('click', () => switchTab(true));
    footerLink.addEventListener('click', () => switchTab(true));

    // Sign In
    formSignIn.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signin-email').value;
      const password = document.getElementById('signin-password').value;

      setLoading(true, 'Signing in...');
      const { user, error } = await signIn(email, password);
      setLoading(false);

      if (error) {
        showError(error.message);
        return;
      }
      window.location.href = '../index.html';
    });

    // Sign Up
    formSignUp.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      setLoading(true, 'Creating account...');
      const { user, error } = await signUp(email, password, name);
      setLoading(false);

      if (error) {
        showError(error.message);
        return;
      }
      
      // If user is returned but we don't have an active session yet,
      // it means email confirmation is required by Supabase.
      const session = await getSession();
      if (!session) {
        switchTab(false);
        showError('Account created! Please check your email to confirm your account before signing in.', true);
        document.getElementById('signin-email').value = email;
      } else {
        window.location.href = '../index.html';
      }
    });

    // Google OAuth
    document.getElementById('btn-google').addEventListener('click', async () => {
      setLoading(true, 'Redirecting to Google...');
      const { error } = await signInWithGoogle();
      if (error) {
        setLoading(false);
        showError(error.message);
      }
    });
  </script>
</body>
</html>
